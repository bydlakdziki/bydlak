name: Sprawdzenie FTPS (tylko odczyt)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź połączenie, logowanie i odczyt katalogów
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import hashlib
          import io
          import os
          import re
          import ssl
          import urllib.request

          stage = "connection"
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
          try:
              ftp.connect(os.environ["FTP_SERVER"], 21)
              print("Connection to port 21: OK", flush=True)
              stage = "TLS"
              ftp.auth()
              print("TLS handshake: OK", flush=True)
              stage = "login"
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              print("Authentication: OK", flush=True)
              stage = "protected data channel"
              ftp.prot_p()
              stage = "root listing"
              root_entries = list(ftp.mlsd())
              root_dirs = {name for name, facts in root_entries if facts.get("type") == "dir"}
              for name, facts in sorted(root_entries):
                  if facts.get("type") in {"cdir", "pdir"}:
                      continue
                  print(
                      f"ROOT {facts.get('type', 'unknown')} "
                      f"size={facts.get('size', '-')} name={name!r}",
                      flush=True,
                  )
              print("FTP root directory listing: OK", flush=True)
              stage = "site inventory"
              def read_file(path):
                  data = io.BytesIO()
                  ftp.retrbinary(f"RETR {path}", data.write)
                  return data.getvalue()

              for directory in ("", "marta", "hotcast"):
                  prefix = f"{directory}/" if directory else ""
                  entries = list(ftp.mlsd(directory or "."))
                  files = {name for name, facts in entries if facts.get("type") == "file"}
                  for filename in ("index.html", ".htaccess", "wyslij.php"):
                      if filename not in files:
                          continue
                      data = read_file(prefix + filename)
                      print(
                          f"FILE {prefix + filename!r} size={len(data)} "
                          f"sha256={hashlib.sha256(data).hexdigest()}",
                          flush=True,
                      )
                      if filename == ".htaccess":
                          print(f"HTACCESS {prefix!r}: {data.decode('utf-8')!r}", flush=True)
                  if directory:
                      for name, facts in sorted(entries):
                          if facts.get("type") in {"file", "dir"}:
                              print(f"SITE {directory!r} {facts['type']} {name!r}", flush=True)

              # Compare web content with FTP without changing either site.
              # This is not a TLS certificate validation test.
              context = ssl._create_unverified_context()
              for host, directory, paths in (
                  ("drmartakryczka.pl", "marta", ("index.html", "en/index.html", "wyslij.php")),
                  ("hotcast.pl", "hotcast", ("index.html",)),
              ):
                  for path in paths:
                      ftp_data = read_file(f"{directory}/{path}")
                      if path.endswith(".php"):
                          continue
                      url = f"https://{host}/{path}"
                      with urllib.request.urlopen(url, context=context, timeout=30) as response:
                          web_data = response.read()
                      if web_data != ftp_data:
                          raise RuntimeError("Website content differs from FTP directory")
                      print(f"WEB_MATCH {host}/{path} = FTP /{directory}/{path}", flush=True)

              stage = "legacy directory inventory"
              def walk(directory):
                  result = []
                  for name, facts in ftp.mlsd(directory):
                      if facts.get("type") == "file":
                          result.append(f"{directory}/{name}")
                      elif facts.get("type") == "dir":
                          result.extend(walk(f"{directory}/{name}"))
                  return result

              for directory in ("_astro", "aktualnosci", "artykuly", "en", "img",
                                "kontakt", "o-mnie", "portfolio", "szkolenia", "zabiegi"):
                  if directory not in root_dirs:
                      continue
                  paths = walk(directory)
                  print(f"LEGACY_DIRECTORY {directory!r} files={len(paths)}", flush=True)
                  for path in paths:
                      print(f"LEGACY_FILE {path!r}", flush=True)
              stage = "marta directory"
              ftp.cwd("marta")
              names = ftp.nlst()
              print("marta directory listing: OK", flush=True)
              if not {"index.html", "wyslij.php"}.issubset(
                  {name.rstrip("/").rsplit("/", 1)[-1] for name in names}
              ):
                  raise RuntimeError("Required site files missing")
              print("index.html and wyslij.php present: OK", flush=True)
              stage = "logout"
              ftp.quit()
              print("Read-only FTPS check completed: OK", flush=True)
          except Exception as error:
              code = re.match(r"^\d{3}", str(error))
              print(
                  f"FAILED stage={stage}; type={type(error).__name__}; "
                  f"FTP code={code.group() if code else 'unavailable'}",
                  flush=True,
              )
              raise SystemExit(1)
          finally:
              ftp.close()
          PY
