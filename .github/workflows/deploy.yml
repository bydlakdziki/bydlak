name: Wdrożenie na home.pl

on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Kontrola SEO (błędy blokują wdrożenie)
        run: python3 .github/scripts/seo_check.py
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: web/dist/
          server-dir: ./marta/
      - name: Zgłoś adresy do IndexNow (Bing i inne)
        continue-on-error: true
        run: python3 .github/scripts/indexnow.py
